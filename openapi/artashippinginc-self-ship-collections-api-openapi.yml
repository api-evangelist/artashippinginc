paths:
  /self_ship_collection_availability_checks:
    post:
      callbacks: {}
      deprecated: false
      description: '**Availability: Public Preview**


        _This endpoint is currently in public preview and available only to approved accounts._ _Please contact Arta to request access for your organization._


        Check carrier pickup availability for a given location, service, and date.


        For `fedex`, availability comes directly from FedEx for each request, so the response is the source of truth for bookable dates and times. It covers the requested date and can include availability for up to two later dates.


        For `dhl`, collections can be scheduled up to 10 days in advance, Monday through Friday, with hourly collection times from 09:00 to 15:00. Collection times that have already passed at the pickup location, or that leave less than 3 hours before `location.close_time`, are not returned.'
      operationId: selfShipCollectionAvailabilityChecks/create
      parameters:
      - description: Authorize your API calls with an Arta API token
        example: ARTA_APIKey s0e1t2e3c4a5s6t7r8o9n10o11m12y
        in: header
        name: Authorization
        required: true
        schema:
          type: string
          x-struct: null
          x-validate: null
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfShipCollectionAvailabilityCheckCreate'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfShipCollectionAvailabilityCheck'
          description: Available pickup slots for the given parameters
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
        '400':
          content:
            application/json:
              schema:
                example:
                  errors:
                  - Only UK and US are supported for DHL self-ship collections
                properties:
                  errors:
                    description: Human-readable error messages that apply to the request as a whole
                    items:
                      type: string
                      x-struct: null
                      x-validate: null
                    type: array
                    x-struct: null
                    x-validate: null
                required:
                - errors
                title: SelfShipCollectionErrorList
                type: object
                x-struct: null
                x-validate: null
          description: Availability could not be checked, for example because the pickup location is outside the supported countries
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
        '403':
          content:
            application/json: {}
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                example:
                  errors:
                    service:
                    - Required property route was not present.
                properties:
                  errors:
                    additionalProperties:
                      items:
                        type: string
                        x-struct: null
                        x-validate: null
                      type: array
                      x-struct: null
                      x-validate: null
                    description: Human-readable error messages keyed by the path of the offending field, for example `location/region` or `service/carrier`. Messages that apply to the request as a whole are keyed by `#`.
                    type: object
                    x-struct: null
                    x-validate: null
                required:
                - errors
                title: SelfShipCollectionFieldErrors
                type: object
                x-struct: null
                x-validate: null
          description: The request body failed validation
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
      summary: Check Self-Ship Collection Availability
      tags:
      - self_ship_collections
  /self_ship_collections:
    get:
      callbacks: {}
      deprecated: false
      description: '**Availability: Public Preview**


        _This endpoint is currently in public preview and available only to approved accounts._ _Please contact Arta to request access for your organization._


        Retrieve a paginated collection of self-ship collection records belonging to your organization, sorted by most recent first'
      operationId: selfShipCollections/list
      parameters:
      - description: Authorize your API calls with an Arta API token
        example: ARTA_APIKey s0e1t2e3c4a5s6t7r8o9n10o11m12y
        in: header
        name: Authorization
        required: true
        schema:
          type: string
          x-struct: null
          x-validate: null
      - description: Page number of the results to fetch.
        in: query
        name: page
        schema:
          default: 1
          type: integer
          x-struct: null
          x-validate: null
      - description: Results per page (max 50)
        in: query
        name: page_size
        schema:
          default: 20
          type: integer
          x-struct: null
          x-validate: null
      - description: An optional sort order for the returned collection.
        in: query
        name: sort
        required: false
        schema:
          enum:
          - created_at_asc
          - created_at_desc
          - updated_at_asc
          - updated_at_desc
          type: string
          x-struct: null
          x-validate: null
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/SelfShipCollection'
                    type: array
                    x-struct: null
                    x-validate: null
                  metadata:
                    properties:
                      page:
                        example: 1
                        format: int64
                        readOnly: true
                        type: integer
                        x-struct: null
                        x-validate: null
                      page_size:
                        example: 20
                        format: int64
                        readOnly: true
                        type: integer
                        x-struct: null
                        x-validate: null
                      total_count:
                        example: 1
                        format: int64
                        readOnly: true
                        type: integer
                        x-struct: null
                        x-validate: null
                    type: object
                    x-struct: null
                    x-validate: null
                type: object
                x-struct: null
                x-validate: null
          description: A collection of Self-Ship Collection records
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
      summary: List Self-Ship Collections
      tags:
      - self_ship_collections
    post:
      callbacks: {}
      deprecated: false
      description: '**Availability: Public Preview**


        _This endpoint is currently in public preview and available only to approved accounts._ _Please contact Arta to request access for your organization._


        Schedule a carrier pickup for a self-ship shipment with FedEx or DHL. Self-ship collections are available for pickup locations in the US and UK.


        **FedEx collections** (`service.carrier: "fedex"`) are scheduled as FedEx Ground or FedEx Express according to `service.code`. An optional package summary may be provided in `service.package_details` for `express` collections, and `location.package_location` tells the driver where to find the packages. FedEx collections cannot be cancelled through the API.


        **DHL collections** (`service.carrier: "dhl"`) are always scheduled with the DHL Express service, so `service.code` must be `express`. They require per-package dimensions and weight in `service.package_details`, and `location.close_time` must be at least 3 hours after `collection_time`. An `international` collection is subject to customs and requires `service.declared_value` and `service.declared_value_currency`; `domestic` collections may omit them. DHL collections can be cancelled with the cancel endpoint.'
      operationId: selfShipCollections/create
      parameters:
      - description: Authorize your API calls with an Arta API token
        example: ARTA_APIKey s0e1t2e3c4a5s6t7r8o9n10o11m12y
        in: header
        name: Authorization
        required: true
        schema:
          type: string
          x-struct: null
          x-validate: null
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfShipCollectionCreate'
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfShipCollection'
          description: The created self-ship collection
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
        '400':
          content:
            application/json:
              schema:
                example:
                  errors:
                  - service.declared_value is required for international DHL collections
                  - service.declared_value_currency is required for international DHL collections
                properties:
                  errors:
                    description: Human-readable error messages that apply to the request as a whole
                    items:
                      type: string
                      x-struct: null
                      x-validate: null
                    type: array
                    x-struct: null
                    x-validate: null
                required:
                - errors
                title: SelfShipCollectionErrorList
                type: object
                x-struct: null
                x-validate: null
          description: 'The collection could not be scheduled: the pickup location is outside the supported countries, a carrier-specific requirement was not met, or the carrier rejected the collection.'
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
        '403':
          content:
            application/json: {}
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                oneOf:
                - example:
                    errors:
                      location/close_time:
                      - must be at least 3 hours after collection_time
                  properties:
                    errors:
                      additionalProperties:
                        items:
                          type: string
                          x-struct: null
                          x-validate: null
                        type: array
                        x-struct: null
                        x-validate: null
                      description: Human-readable error messages keyed by the path of the offending field, for example `location/region` or `service/carrier`. Messages that apply to the request as a whole are keyed by `#`.
                      type: object
                      x-struct: null
                      x-validate: null
                  required:
                  - errors
                  title: SelfShipCollectionFieldErrors
                  type: object
                  x-struct: null
                  x-validate: null
                - example:
                    errors:
                    - service.package_details.packages[0].weight must be a number
                  properties:
                    errors:
                      description: Human-readable error messages that apply to the request as a whole
                      items:
                        type: string
                        x-struct: null
                        x-validate: null
                      type: array
                      x-struct: null
                      x-validate: null
                  required:
                  - errors
                  title: SelfShipCollectionErrorList
                  type: object
                  x-struct: null
                  x-validate: null
                title: SelfShipCollectionValidationErrors
                x-struct: null
                x-validate: null
          description: The request body failed validation. Errors are keyed by the offending field path; invalid package measurement values are returned as a flat list.
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
      summary: Create a Self-Ship Collection
      tags:
      - self_ship_collections
  /self_ship_collections/{self_ship_collection_id}:
    get:
