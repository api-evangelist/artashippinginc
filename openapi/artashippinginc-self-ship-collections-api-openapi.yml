  /self_ship_collections/{self_ship_collection_id}/cancel:
    patch:
      callbacks: {}
      deprecated: false
      description: '**Availability: Public Preview**


        _This endpoint is currently in public preview and available only to approved accounts._ _Please contact Arta to request access for your organization._


        Cancel a scheduled self-ship collection. The collection''s `status` becomes `cancelled`.


        Cancellation through the API is currently supported for DHL collections only; attempting to cancel a FedEx collection returns a `422` with `{"errors": {"#": ["Only DHL collections can be cancelled"]}}`. If the carrier rejects the cancellation, the carrier''s error messages are returned in a `400` response under `#`.'
      operationId: selfShipCollections/cancel
      parameters:
      - description: Authorize your API calls with an Arta API token
        example: ARTA_APIKey s0e1t2e3c4a5s6t7r8o9n10o11m12y
        in: header
        name: Authorization
        required: true
        schema:
          type: string
          x-struct: null
          x-validate: null
      - description: self_ship_collection_id parameter
        in: path
        name: self_ship_collection_id
        required: true
        schema:
          type: string
          x-struct: null
          x-validate: null
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfShipCollection'
          description: The cancelled self-ship collection
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
        '400':
          content:
            application/json:
              schema:
                example:
                  errors:
                    '#':
                    - The carrier rejected the request (HTTP 400)
                properties:
                  errors:
                    additionalProperties:
                      items:
                        type: string
                        x-struct: null
                        x-validate: null
                      type: array
                      x-struct: null
                      x-validate: null
                    description: Human-readable error messages keyed by the path of the offending field, for example `location/region` or `service/carrier`. Messages that apply to the request as a whole are keyed by `#`.
                    type: object
                    x-struct: null
                    x-validate: null
                required:
                - errors
                title: SelfShipCollectionFieldErrors
                type: object
                x-struct: null
                x-validate: null
          description: The carrier rejected the cancellation. The carrier's messages are returned under `#`.
          headers:
            content-type:
              example: application/json
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
            x-arta-request-id:
              description: A unique identifier for the Arta API call
              example: FkBjuxbwLLTx4RoAARkx
              schema:
                type: string
                x-struct: null
                x-validate: null
              style: simple
        '403':
          content:
            application/json: {}
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                properties:
                  errors:
                    properties:
                      detail:
                        example: string
                        type: string
                        x-struct: null
                        x-validate: null
                    type: object
                    x-struct: null
                    x-validate: null
                title: NotFound
                type: object
                x-struct: null
                x-validate: null
          description: Not Found
          headers:
