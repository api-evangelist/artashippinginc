components:
  schemas:
    DhlSelfShipCollectionPayload:
      additionalProperties: false
      description: Schedule a DHL collection
      properties:
        self_ship_collection:
          properties:
            collection_date:
              description: Pickup date in ISO 8601 format (`YYYY-MM-DD`). Must be in the future.
              example: '2026-03-06'
              format: date
              type: string
              x-struct: null
              x-validate: null
            collection_time:
              description: Pickup time in ISO 8601 format (`HH:MM:SS`). Must be before `location.close_time`.
              example: '10:00:00'
              type: string
              x-struct: null
              x-validate: null
            location:
              description: Pickup location details
              properties:
                address_line_1:
                  description: Street address
                  example: 123 Main St
                  minLength: 1
                  type: string
                  x-struct: null
                  x-validate: null
                address_line_2:
                  description: Additional address info
                  nullable: true
                  type: string
                  x-struct: null
                  x-validate: null
                city:
                  description: City
                  example: New York
                  minLength: 1
                  type: string
                  x-struct: null
                  x-validate: null
                close_time:
                  description: Location closing time in ISO 8601 format (`HH:MM:SS`). Must be at least 3 hours after `collection_time`.
                  example: '17:00:00'
                  type: string
                  x-struct: null
                  x-validate: null
                contact:
                  description: Contact at the pickup location
                  properties:
                    email_address:
                      description: Contact email address
                      example: john@example.com
                      nullable: true
                      type: string
                      x-struct: null
                      x-validate: null
                    name:
                      description: Contact name
                      example: John Doe
                      type: string
                      x-struct: null
                      x-validate: null
                    phone_number:
                      description: Contact phone number
                      example: +1-555-123-4567
                      type: string
                      x-struct: null
                      x-validate: null
                  required:
                  - name
                  - phone_number
                  type: object
                  x-struct: null
                  x-validate: null
                country:
                  description: Two-letter country code. Currently `US` and `GB` are supported.
                  example: US
                  type: string
                  x-struct: null
                  x-validate: null
                postal_code:
                  description: Postal code
                  example: '10001'
                  minLength: 1
                  type: string
                  x-struct: null
                  x-validate: null
                region:
                  description: State or territory code. Required for `US` addresses and must be a valid US state or territory code; may be an empty string for `GB` addresses.
                  example: NY
                  type: string
                  x-struct: null
                  x-validate: null
              required:
              - address_line_1
              - city
              - country
              - region
              - postal_code
              - close_time
              - contact
              type: object
              x-struct: null
              x-validate: null
            service:
              description: Carrier service details
              properties:
                carrier:
                  description: Carrier identifier
                  enum:
                  - dhl
                  type: string
                  x-struct: null
                  x-validate: null
                code:
                  description: Service level code. Must be `express`.
                  enum:
                  - express
                  type: string
                  x-struct: null
                  x-validate: null
                declared_value:
                  description: Declared value of the collected packages, as a decimal string. Required when `route` is `international`; optional for `domestic` collections. Must be provided together with `declared_value_currency`.
                  example: '500.00'
                  pattern: ^(0|([1-9]+[0-9]*))(\.[0-9]{1,2})?$
                  title: MonetaryAmount
                  type: string
                  x-struct: null
                  x-validate: null
                declared_value_currency:
                  description: ISO 4217 three-letter currency code for `declared_value`. Options are defined in the [Currencies metadata endpoint](https://api-reference.arta.io/operation/operation-metadata-currencies). Required whenever `declared_value` is provided.
                  example: USD
                  maxLength: 3
                  minLength: 3
                  pattern: ^[A-Z]{3}$
                  title: Currency
                  type: string
                  x-struct: null
                  x-validate: null
                package_details:
                  description: The packages to be collected, one entry per package. All packages must share the same units, and the unit pair must be either `in` + `lb` or `cm` + `kg`.
                  example:
                    packages:
                    - depth: '12'
                      height: '8'
                      unit_of_measurement: in
                      weight: '5.5'
                      weight_unit: lb
                      width: '10'
                  properties:
                    packages:
                      description: The packages included in the collection. Must contain at least one package. Dimensions and weight are numeric strings (for example `"12"` or `"12.5"`), following the same convention as `request.objects`; a value that cannot be parsed as a number is rejected with a `422`.
                      items:
                        properties:
                          depth:
                            description: Package depth
                            example: '12'
                            type: string
                            x-struct: null
                            x-validate: null
                          height:
                            description: Package height
                            example: '8'
                            type: string
                            x-struct: null
                            x-validate: null
                          unit_of_measurement:
                            description: Unit for `depth`, `height`, and `width`. Must be `in` when `weight_unit` is `lb`, or `cm` when `weight_unit` is `kg`.
                            enum:
                            - in
                            - cm
                            example: in
                            type: string
                            x-struct: null
                            x-validate: null
                          weight:
                            description: Package weight
                            example: '5.5'
                            type: string
                            x-struct: null
                            x-validate: null
